<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Catálogo Oficial 2026 — MM Racing Fuel</title>
  <meta name="description" content="Confira o catálogo oficial 2026 da MM Racing Fuel. Combustíveis de alta performance: M100, Nitro100, M5, M10, M20 e ColdPower." />
  <link rel="icon" type="image/x-icon" href="src/app/favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      padding-bottom: 90px;
    }
    /* Sticky Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #222222;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-btn {
      color: #888888;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }
    .nav-btn:hover {
      color: #FD4102;
    }
    .header-title {
      text-align: center;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .brand-dot {
      color: #FD4102;
    }
    .brand-sub {
      font-size: 9px;
      color: #FD4102;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      display: block;
      margin-top: 2px;
    }
    /* Feed Container */
    .feed {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .page-card {
      position: relative;
      background-color: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .page-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 1px solid #333333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #aaaaaa;
      z-index: 10;
    }
    .page-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Sticky Bottom Floating Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 12px;
      background-color: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid #222222;
      display: flex;
      justify-content: center;
    }
    .btn-wa-float {
      width: 100%;
      max-width: 480px;
      background-color: #FD4102;
      color: #000000;
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 0 25px rgba(253, 65, 2, 0.4);
    }
    .btn-wa-float:hover {
      background-color: #e03a02;
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(253, 65, 2, 0.6);
    }
    .btn-wa-float:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <header>
    <a href="index.html" class="nav-btn">← Início</a>
    <div class="header-title">
      <span class="brand-name">MM RACING<span class="brand-dot">.</span>FUEL</span>
      <span class="brand-sub">Catálogo Oficial 2026</span>
    </div>
    <a href="public/catalogo.pdf" target="_blank" rel="noopener noreferrer" class="nav-btn">PDF ↗</a>
  </header>

  <!-- Feed with all 10 pages in high quality -->
  <main class="feed">
    <!-- Page 1: M100 5L -->
    <div class="page-card">
      <div class="page-badge">1 / 10</div>
      <img src="public/catalogo-pages/page-1.webp" alt="M100 5L MM Racing Fuel" loading="eager" />
    </div>

    <!-- Page 2: M100 18L -->
    <div class="page-card">
      <div class="page-badge">2 / 10</div>
      <img src="public/catalogo-pages/page-2.webp" alt="M100 18L MM Racing Fuel" loading="eager" />

    <!-- Page 4: NITRO100 1L -->

    </div>

    <!-- Page 5: NITRO100 5L -->

      <div class="page-badge">5 / 10</div>
      <img src="public/catalogo-pages/page-5.webp" alt="NITRO 100 5L MM Racing Fuel" loading="lazy" />
    </div>

    <!-- Page 6: M5 20L -->
    <div class="page-card">
      <div class="page-badge">6 / 10</div>
      <img src="public/catalogo-pages/page-6.webp" alt="M5 20L MM Racing Fuel" loading="lazy" />
    </div>

    <!-- Page 7: M10 20L -->
    <div class="page-card">
      <div class="page-badge">7 / 10</div>
      <img src="public/catalogo-pages/page-7.webp" alt="M10 20L MM Racing Fuel" loading="lazy" />
    </div>

    <!-- Page 8: M20 20L -->
    <div class="page-card">
      <div class="page-badge">8 / 10</div>
      <img src="public/catalogo-pages/page-8.webp" alt="M20 20L MM Racing Fuel" loading="lazy" />
    </div>

    <!-- Page 9: COLDPOWER 5L -->
    <div class="page-card">
      <div class="page-badge">9 / 10</div>

    </div>

    <!-- Page 10: Cotação WhatsApp -->
    <div class="page-card">
      <div class="page-badge">10 / 10</div>
      <a href="https://wa.me/5511922880177?text=Ol%C3%A1%2C%20equipe%20MM%20Racing%20Fuel%21%20Acessei%20o%20Cat%C3%A1logo%20Oficial%202026%20pelo%20link%20da%20bio%20e%20gostaria%20de%20solicitar%20uma%20cota%C3%A7%C3%A3o%20para%20o%20meu%20projeto.%20Poderiam%20me%20passar%20os%20valores%20e%20condi%C3%A7%C3%B5es%20de%20envio%2C%20por%20favor%3F" target="_blank" rel="noopener noreferrer" style="display:block;">
        <img src="public/catalogo-pages/page-10.webp" alt="Faça sua cotação no WhatsApp MM Racing Fuel" loading="lazy" />
      </a>
    </div>
  </main>

  <!-- Sticky Floating WhatsApp Button -->
  <div class="bottom-bar">
    <a href="https://wa.me/5511922880177?text=Ol%C3%A1%2C%20equipe%20MM%20Racing%20Fuel%21%20Acessei%20o%20Cat%C3%A1logo%20Oficial%202026%20pelo%20link%20da%20bio%20e%20gostaria%20de%20solicitar%20uma%20cota%C3%A7%C3%A3o%20para%20o%20meu%20projeto.%20Poderiam%20me%20passar%20os%20valores%20e%20condi%C3%A7%C3%B5es%20de%20envio%2C%20por%20favor%3F" target="_blank" rel="noopener noreferrer" class="btn-wa-float">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <span>FAZER COTAÇÃO NO WHATSAPP</span>
    </a>
  </div>

</body>
</html>
