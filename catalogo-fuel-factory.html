<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Catálogo Oficial Fuel Factory 2026 — Distribuidor Oficial Brasil</title>
  <meta name="description" content="Confira o catálogo oficial da Fuel Factory Brasil sem valores para cotação. Combustíveis de corrida de alta octanagem: F NOS, 2WL, MXR 4T, K2 MX, MX RIP, MXR 2 e acessórios." />
  <link rel="icon" type="image/x-icon" href="src/app/favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      padding-bottom: 90px;
    }
    /* Sticky Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #222222;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-btn {
      color: #888888;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }
    .nav-btn:hover {
      color: #D2F005;
    }
    .header-title {
      text-align: center;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .brand-dot {
      color: #D2F005;
    }
    .brand-sub {
      font-size: 9px;
      color: #D2F005;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      display: block;
      margin-top: 2px;
    }
    /* Feed Container */
    .feed {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .page-card {
      position: relative;
      background-color: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transition: border-color 0.2s ease;
    }
    .page-card:hover {
      border-color: #333333;
    }
    .page-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 1px solid #333333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #aaaaaa;
      z-index: 10;
    }
    .page-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Sticky Bottom Floating Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 12px;
      background-color: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid #222222;
      display: flex;
      justify-content: center;
    }
    .btn-wa-float {
      width: 100%;
      max-width: 480px;
      background-color: #D2F005;
      color: #000000;
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 0 25px rgba(210, 240, 5, 0.45);
    }
    .btn-wa-float:hover {
      background-color: #bce000;
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(210, 240, 5, 0.65);
    }
    .btn-wa-float:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
